<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#000" name="theme-color"/><title>Sichere Kontaktaufnahme</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#ddd;font-family:"Courier New",monospace}main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.terminal{width:min(620px,100%)}label{display:block;font-size:12px;letter-spacing:.15em;margin-bottom:13px;color:#aaa}input{width:100%;background:#000;border:1px solid #777;color:#eee;padding:14px;font:16px "Courier New",monospace;outline:none}input:focus{border-color:#ddd}button{margin-top:12px;background:#000;border:1px solid #777;color:#ddd;padding:11px 16px;font:bold 13px "Courier New",monospace;cursor:pointer}.msg{min-height:24px;margin-top:24px;font-size:14px;letter-spacing:.04em}</style><link href="/assets/backlink.css" rel="stylesheet"/></head><body><main><form class="terminal" id="dead"><label for="code">GESICHERTE EINGABE</label><input autocomplete="off" autofocus="" id="code"/><button type="submit">ÜBERMITTELN</button><div aria-live="polite" class="msg" id="msg"></div></form></main><script>document.querySelector('#dead').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#msg').textContent='Eingabe inkorrekt. Bitte versuchen Sie es erneut!';document.querySelector('#code').value='';document.querySelector('#code').focus()})</script><div style="width:min(1050px,calc(100% - 36px));margin:28px auto 42px"><a class="wwg-global-back" href="/">← Zur Zentralen Dienststelle</a></div></body></html>
